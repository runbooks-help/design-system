name: Release

# A tag publishes the design language as pinned release assets: tokens.css,
# fonts.css and the fonts bundle. Consumers fetch the tag they pin.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bundle the fonts
        run: tar czf fonts.tar.gz fonts

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" tokens.css fonts.css fonts.tar.gz --generate-notes
